<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Home Studio 5D</title>
<style>
:root{--bg:#10141a;--panel:#1a1f27;--line:#2a313c;--tx:#e8ecf1;--mut:#8b96a5;--acc:#4da3ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
header,#tools,#pbar,#rbar,footer{background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:6px 10px;flex:none;overflow-x:auto;white-space:nowrap}
footer{border-bottom:0;border-top:1px solid var(--line)}
header b{font-size:15px;margin-right:6px}
.sp{flex:1}
button,select,input{font:inherit;color:var(--tx)}
button{background:#232a35;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{background:#2c3542}
button.on{background:var(--acc);border-color:var(--acc);color:#04121f;font-weight:600}
select,input[type=number],input[type=text]{background:#12171e;border:1px solid var(--line);border-radius:6px;padding:5px 6px}
input[type=number]{width:66px}
#tabs{display:flex;gap:4px}
#stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;touch-action:none;display:block}
#insp{position:absolute;left:8px;right:8px;bottom:8px;display:none;flex-wrap:wrap;align-items:center;gap:8px;background:rgba(26,31,39,.96);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-height:46%;overflow:auto}
#insp label{color:var(--mut);display:flex;align-items:center;gap:4px}
#hint{position:absolute;left:10px;top:8px;color:var(--mut);font-size:12px;pointer-events:none;text-shadow:0 1px 2px #000}
#cost{position:absolute;inset:0;overflow:auto;padding:14px;display:none;background:var(--bg)}
#cost h2{margin:18px 0 8px;font-size:15px}
#cost h2:first-child{margin-top:0}
table{border-collapse:collapse;width:100%;max-width:760px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500;font-size:12px}
td.r,th.r{text-align:right}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.gantt{max-width:760px}
.grow{display:flex;align-items:center;gap:8px;margin:6px 0}
.grow span.l{width:92px;color:var(--mut);font-size:12px}
.gtrack{position:relative;flex:1;height:18px;background:#161b22;border-radius:5px}
.gbar{position:absolute;top:0;bottom:0;border-radius:5px;color:#04121f;font-size:11px;font-weight:600;padding-left:6px;overflow:hidden}
.rates{display:flex;flex-wrap:wrap;gap:10px}
.rates label{color:var(--mut);display:flex;align-items:center;gap:6px}
.big{font-size:22px;font-weight:700}
.note{color:var(--mut);font-size:12px;max-width:760px}
#ph{width:180px}
#pbar,#rbar{display:none}
#sw{display:flex;gap:5px}
.swb{width:28px;height:28px;border-radius:7px;border:2px solid var(--line);padding:0;color:#fff;font-size:13px;flex:none}
.swb.on{border-color:#fff}
.inl{display:flex;align-items:center;gap:4px;color:var(--mut)}
#pc{width:34px;height:30px;padding:0;border:0;background:none}
#toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:rgba(26,31,39,.96);border:1px solid var(--line);padding:6px 14px;border-radius:20px;display:none;pointer-events:none;z-index:5}
#rbar select{max-width:48vw}
#phasebar label{display:flex;align-items:center;gap:5px;margin-left:10px;color:var(--mut)}
#phasebar input[type=checkbox]{width:18px;height:18px}
</style>
</head>
<body>
<header>
  <b>Home Studio 5D</b>
  <nav id="tabs">
    <button data-t="plan" class="on">Plan</button>
    <button data-t="3d">3D</button>
    <button data-t="cost">Cost &amp; Time</button>
  </nav>
  <span class="sp"></span>
  <button id="bUndo">Undo</button>
  <button id="bCk">Saved ✓</button>
  <button id="bRest">Restore</button>
  <button id="bSave">Export</button>
  <button id="bLoad">Import</button>
  <button id="bPng">PNG</button>
  <button id="bNew">New</button>
  <input type="file" id="file" accept=".json,application/json" hidden>
</header>
<div id="tools">
  <button id="bLock" class="on">🔒 Locked</button>
  <button data-tool="select" class="on">Select</button>
  <button data-tool="wall">Wall</button>
  <button data-tool="room">Room</button>
  <button data-tool="door">Door</button>
  <button data-tool="window">Window</button>
  <button data-tool="furn">Furniture</button>
  <select id="fk"></select>
  <button data-tool="roof">Roof</button>
  <button id="bAuto">Auto roof</button>
  <button data-tool="paint">Paint</button>
  <button data-tool="erase">Erase</button>
  <label class="inl">Wall H <input type="number" id="wh" step=".1" min="2" max="10"></label><button id="bWh">Apply</button>
</div>
<div id="pbar"><span id="sw"></span><input type="color" id="pc" value="#f5f1e8" title="Custom colour"><label class="inl"><input type="checkbox" id="pboth"> both sides</label><button id="pclr">Clear all paint</button></div>
<div id="rbar"><span>Inside</span><select id="rsel"></select><button class="rwalk" id="rL">⟲</button><button class="rwalk" id="rR">⟳</button><button class="rwalk" id="rF">▲ Walk</button><button class="rwalk" id="rB">▼ Back</button></div>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hint"></div>
  <div id="toast"></div>
  <div id="insp"></div>
  <div id="cost"></div>
</div>
<footer id="phasebar">
  <span>Build phase</span>
  <input type="range" id="ph" min="1" max="5" value="5">
  <span id="phl"></span>
  <label><input type="checkbox" id="roofT" checked> Roof</label>
</footer>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const KEY='homestudio5d.v1';
const BG='#10141a';
const PH=[{n:'Floors',c:'#c9a36a'},{n:'Structure',c:'#9aa7b5'},{n:'Roof',c:'#d98c6a'},{n:'Openings',c:'#6fb3e0'},{n:'Furnishing',c:'#8bd18b'}];
// c = colour, p = default price per m2, pat = pattern drawn on the floor (s = spacing in metres)
const FLOORS={
 wood:{n:'Wood planks',c:'#b98e5f',p:90,pat:{t:'planks',s:.25}},
 laminate:{n:'Laminate',c:'#c9a97f',p:55,pat:{t:'planks',s:.2}},
 tile:{n:'Ceramic tile',c:'#b9c3cc',p:65,pat:{t:'grid',s:.6}},
 marble:{n:'Marble',c:'#e4e2dc',p:160,pat:{t:'grid',s:1}},
 terrazzo:{n:'Terrazzo',c:'#cfc6bd',p:110,pat:{t:'grid',s:1.2}},
 concrete:{n:'Concrete',c:'#8d949b',p:35,pat:{t:'grid',s:2}},
 vinyl:{n:'Vinyl',c:'#a7b3a0',p:40,pat:{t:'planks',s:.4}},
 carpet:{n:'Carpet',c:'#7d8aa0',p:45,pat:null},
 pavers:{n:'Brick pavers',c:'#a45a46',p:50,pat:{t:'grid',s:.3}}
};
const ROOFS={
 metal:{n:'Iron / metal sheets',c:'#8a96a3',p:30},
 gmetal:{n:'Coated metal (green)',c:'#4a7c59',p:38},
 clay:{n:'Clay tiles',c:'#b5563a',p:55},
 ctile:{n:'Concrete tiles',c:'#8e8a84',p:48},
 shingle:{n:'Asphalt shingles',c:'#5b4f4a',p:42},
 slate:{n:'Slate',c:'#4a5663',p:95},
 thatch:{n:'Thatch',c:'#b39a5e',p:25},
 slab:{n:'Concrete slab',c:'#9b9b9b',p:80}
};
const RTYPES={gable:'Gable',hip:'Hip',shed:'Shed (one slope)',flat:'Flat slab'};
const GABLE_WALL='#e6e1d8';
function defPrices(){const f={},r={};for(const k in FLOORS)f[k]=FLOORS[k].p;for(const k in ROOFS)r[k]=ROOFS[k].p;return{floor:f,roof:r};}
// parts: [centerX, centerY (fractions of w,d), fracW, fracD, z0, z1, color]
const FURN={
 bed:{n:'Bed',w:1.6,d:2,price:800,c:'#c9b99a',parts:[[0,0,1,1,0,.45,'#c9b99a'],[0,-.38,.9,.16,.45,.58,'#f3f3f3'],[0,-.485,1,.03,0,1,'#7a5a3c']]},
 sofa:{n:'Sofa',w:2,d:.9,price:650,c:'#6b7b94',parts:[[0,.1,1,.8,0,.42,'#6b7b94'],[0,-.4,1,.2,0,.85,'#6b7b94'],[-.46,.1,.08,.8,0,.62,'#5a6a82'],[.46,.1,.08,.8,0,.62,'#5a6a82']]},
 table:{n:'Table',w:1.6,d:.9,price:300,c:'#a37a52',parts:[[0,0,1,1,.72,.77,'#a37a52'],[-.45,-.42,.06,.08,0,.72,'#8a6642'],[.45,-.42,.06,.08,0,.72,'#8a6642'],[-.45,.42,.06,.08,0,.72,'#8a6642'],[.45,.42,.06,.08,0,.72,'#8a6642']]},
 chair:{n:'Chair',w:.45,d:.45,price:80,c:'#b08d62',parts:[[0,0,1,1,.42,.47,'#b08d62'],[0,-.45,1,.1,.47,.95,'#b08d62'],[-.44,-.44,.12,.12,0,.42,'#8a6642'],[.44,-.44,.12,.12,0,.42,'#8a6642'],[-.44,.44,.12,.12,0,.42,'#8a6642'],[.44,.44,.12,.12,0,.42,'#8a6642']]},
 wardrobe:{n:'Wardrobe',w:1.2,d:.6,price:450,c:'#8a6a4a',parts:[[0,0,1,1,0,2,'#8a6a4a']]},
 desk:{n:'Desk',w:1.4,d:.7,price:250,c:'#c2a07a',parts:[[0,0,1,1,.72,.76,'#c2a07a'],[-.46,0,.06,1,0,.72,'#a68464'],[.46,0,.06,1,0,.72,'#a68464']]},
 tv:{n:'TV unit',w:1.5,d:.4,price:200,c:'#4a3b30',parts:[[0,0,1,1,0,.45,'#4a3b30'],[0,0,.7,.1,.45,.95,'#111']]},
 counter:{n:'Kitchen counter',w:2.4,d:.6,price:900,c:'#d0d0d0',parts:[[0,0,1,1,0,.88,'#d0d0d0'],[0,0,1,1,.88,.92,'#555']]},
 toilet:{n:'Toilet',w:.4,d:.7,price:220,c:'#f4f4f4',parts:[[0,.2,.8,.6,0,.4,'#f4f4f4'],[0,-.35,.8,.3,0,.8,'#f4f4f4']]},
 bath:{n:'Bathtub',w:1.7,d:.75,price:600,c:'#f4f6f8',parts:[[0,0,1,1,0,.55,'#f4f6f8']]},
 sink:{n:'Sink',w:.6,d:.45,price:150,c:'#f4f6f8',parts:[[0,0,1,1,.8,.88,'#f4f6f8'],[0,0,.3,.3,0,.8,'#cfcfcf']]},
 plant:{n:'Plant',w:.4,d:.4,price:40,c:'#3f8f4a',parts:[[0,0,.5,.5,0,.3,'#8a4b2a'],[0,0,.9,.9,.3,1,'#3f8f4a']]},
 rug:{n:'Rug',w:2,d:1.4,price:120,c:'#8b5e5e',parts:[[0,0,1,1,0,.02,'#8b5e5e']]}
};
const RATES0={wall:45,door:350,window:280};
const OPEN_DEF={door:{w:.9},window:{w:1.2}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sn=(v,g=.25)=>Math.round(v/g)*g;
const r2=v=>Math.round(v*100)/100;

let S;
function add(type,o){o.id=S.nid++;S[type].push(o);return o;}
function blank(){return{name:'My home',cur:'$',rates:{...RATES0},prices:defPrices(),wallH:3.2,rooms:[],walls:[],opens:[],furn:[],roofs:[],nid:1};}
function sample(){
  S=blank();
  add('rooms',{x:0,y:0,w:5,d:6,name:'Living',floor:'wood'});
  add('rooms',{x:5,y:0,w:3,d:3.5,name:'Bedroom',floor:'carpet'});
  add('rooms',{x:5,y:3.5,w:3,d:2.5,name:'Bath',floor:'tile'});
  const W=[[0,0,8,0],[8,0,8,6],[8,6,0,6],[0,6,0,0],[5,0,5,6],[5,3.5,8,3.5]].map(a=>add('walls',{x1:a[0],y1:a[1],x2:a[2],y2:a[3],t:.15,h:S.wallH}));
  add('opens',{wall:W[2].id,t:.7,kind:'door',w:1});
  add('opens',{wall:W[4].id,t:.2,kind:'door',w:.9});
  add('opens',{wall:W[5].id,t:.5,kind:'door',w:.8});
  add('opens',{wall:W[0].id,t:.3,kind:'window',w:1.6});
  add('opens',{wall:W[0].id,t:.8,kind:'window',w:1.2});
  add('opens',{wall:W[1].id,t:.85,kind:'window',w:.8});
  add('opens',{wall:W[3].id,t:.85,kind:'window',w:1.2});
  const F=(kind,x,y,rot,w,d)=>add('furn',{kind,x,y,rot,w:w||FURN[kind].w,d:d||FURN[kind].d});
  F('bed',6.5,1.35,0);F('wardrobe',7.2,3.15,0);
  F('sofa',2.5,.75,0);F('rug',2.5,2.4,0);F('table',2.5,2.4,0,1,.6);
  F('tv',2.5,3.6,180);F('counter',.35,4.0,90);
  F('table',3.4,4.9,0,1.4,.8);F('chair',2.9,4.3,180);F('chair',3.9,4.3,180);F('chair',2.9,5.5,0);F('chair',3.9,5.5,0);
  F('bath',6.9,5.55,0);F('toilet',5.5,4.2,90);F('sink',7.4,3.85,0);F('plant',4.55,5.55,0);
  add('roofs',{x:0,y:0,w:8,d:6,type:'gable',pitch:25,over:.4,mat:'clay',base:S.wallH,dir:'auto',flip:false});
}
function load(){
  try{const t=localStorage.getItem(KEY);if(t){S=JSON.parse(t);norm();return true;}}catch(e){}
  return false;
}
function norm(){
  S.rooms=S.rooms||[];S.walls=S.walls||[];S.opens=S.opens||[];S.furn=S.furn||[];S.roofs=S.roofs||[];
  S.rates={...RATES0,...(S.rates||{})};S.cur=S.cur||'$';S.name=S.name||'My home';
  let m=0;for(const k of ['rooms','walls','opens','furn','roofs'])for(const o of S[k])m=Math.max(m,o.id||0);
  S.nid=Math.max(S.nid||1,m+1);
  S.furn=S.furn.filter(f=>FURN[f.kind]);
  if(S.wallH==null){const uni=S.walls.length&&S.walls.every(w=>Math.abs((w.h||2.8)-2.8)<.01);S.wallH=3.2;if(uni){S.walls.forEach(w=>{w.h=3.2;});S.roofs.forEach(q=>{if(!q.base||Math.abs(q.base-2.8)<.01)q.base=3.2;});}}
  const dp=defPrices(),sp=S.prices||{};
  S.prices={floor:{...dp.floor,...(sp.floor||{})},roof:{...dp.roof,...(sp.roof||{})}};
  S.rooms.forEach(r=>{if(!FLOORS[r.floor])r.floor='concrete';});
  S.roofs.forEach(q=>{if(!RTYPES[q.type])q.type='gable';if(!ROOFS[q.mat])q.mat='metal';q.pitch=q.pitch||25;q.over=q.over==null?.5:q.over;q.base=q.base||S.wallH;q.dir=q.dir||'auto';});
}
function newRoof(x,y,w,d){
  const q=add('roofs',{x,y,w,d,type:'gable',pitch:25,over:.5,mat:'metal',base:S.wallH,dir:'auto',flip:false});
  showRoof=true;const cb=$('#roofT');if(cb)cb.checked=true;
  if(phase<3){phase=5;const sl=$('#ph');if(sl)sl.value=5;updPhase();}
  return q;
}
function autoRoof(){
  if(!S.rooms.length){alert('Draw some rooms first.');return;}
  const R=S.rooms,par=R.map((_,i)=>i),find=i=>par[i]===i?i:(par[i]=find(par[i]));
  const near=(a,b)=>a.x<=b.x+b.w+.3&&b.x<=a.x+a.w+.3&&a.y<=b.y+b.d+.3&&b.y<=a.y+a.d+.3;
  for(let i=0;i<R.length;i++)for(let j=i+1;j<R.length;j++)if(near(R[i],R[j]))par[find(i)]=find(j);
  const cl={};R.forEach((r,i)=>{(cl[find(i)]=cl[find(i)]||[]).push(r);});
  undoPush();let n=0;
  for(const k in cl){
    const g=cl[k],x0=Math.min(...g.map(r=>r.x)),y0=Math.min(...g.map(r=>r.y)),x1=Math.max(...g.map(r=>r.x+r.w)),y1=Math.max(...g.map(r=>r.y+r.d));
    const cx=(x0+x1)/2,cy=(y0+y1)/2;
    if(S.roofs.some(q=>cx>=q.x-q.over&&cx<=q.x+q.w+q.over&&cy>=q.y-q.over&&cy<=q.y+q.d+q.over))continue;
    newRoof(x0,y0,x1-x0,y1-y0);n++;
  }
  save();draw();
  if(!n)alert('Every room group already has a roof.');
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}dirty=true;updCk();}
function updCk(){const b=$('#bCk');if(b)b.textContent=dirty?'Save •':'Saved ✓';}
function toast(m){const t=$('#toast');if(!t)return;t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>{t.style.display='none';},2000);}
function doCheckpoint(quiet){
  try{localStorage.setItem(KEY+'.ck',JSON.stringify({t:Date.now(),data:S}));}catch(e){toast('Could not save');return false;}
  dirty=false;updCk();if(!quiet)toast('Saved '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));return true;
}
function restoreCheckpoint(){
  let ck=null;try{ck=JSON.parse(localStorage.getItem(KEY+'.ck'));}catch(e){}
  if(!ck||!ck.data){alert('No saved version yet. Tap Save first.');return;}
  if(!confirm('Go back to the version you saved at '+new Date(ck.t).toLocaleString()+'? Anything changed since then will be replaced (Undo can bring it back).'))return;
  undoPush();S=ck.data;norm();sel=null;save();dirty=false;updCk();renderInsp();renderRoomSel();updPhase();draw();if(tab==='cost')renderCost();toast('Restored your saved version');
}
let hist=[];
function undoPush(){hist.push(JSON.stringify(S));if(hist.length>60)hist.shift();}
function undo(){if(!hist.length)return;S=JSON.parse(hist.pop());norm();sel=null;save();renderInsp();draw();if(tab==='cost')renderCost();}

// ------- state
const cv=$('#cv'),ctx=cv.getContext('2d');
let W=0,H=0,dpr=1,tab='plan',tool='select',phase=5,sel=null,showRoof=true,inside=null,locked=true,paintColor='#f5f1e8',dirty=false,savedCam=null,fp={x:0,y:0};
try{locked=localStorage.getItem('homestudio5d.lock')!=='0';}catch(e){}
let view={x:4,y:3,s:50};
let cam={yaw:.6,pitch:.65,dist:14,tx:4,ty:.8,tz:3};
const get=(type,id)=>S[type].find(o=>o.id===id);
const wallOf=id=>S.walls.find(w=>w.id===id);
const w2s=(x,y)=>[(x-view.x)*view.s+W/2,(y-view.y)*view.s+H/2];
const s2w=(sx,sy)=>[(sx-W/2)/view.s+view.x,(sy-H/2)/view.s+view.y];
const money=v=>S.cur+Math.round(v).toLocaleString();
const gh=p=>phase>=p?1:.22;

function bounds(){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  const P=(x,y)=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);};
  S.rooms.forEach(r=>{P(r.x,r.y);P(r.x+r.w,r.y+r.d);});
  S.walls.forEach(w=>{P(w.x1,w.y1);P(w.x2,w.y2);});
  S.furn.forEach(f=>{P(f.x-f.w/2,f.y-f.d/2);P(f.x+f.w/2,f.y+f.d/2);});
  S.roofs.forEach(r=>{P(r.x-r.over,r.y-r.over);P(r.x+r.w+r.over,r.y+r.d+r.over);});
  if(x0>x1)return{x0:0,y0:0,x1:8,y1:6};
  return{x0,y0,x1,y1};
}
function fitPlan(){
  const b=bounds();view.x=(b.x0+b.x1)/2;view.y=(b.y0+b.y1)/2;
  view.s=clamp(Math.min(W/(b.x1-b.x0+2),H/(b.y1-b.y0+3)),3,120);
}
function resetCam(){
  const b=bounds();cam.tx=(b.x0+b.x1)/2;cam.tz=(b.y0+b.y1)/2;cam.ty=.8;
  cam.dist=Math.max(b.x1-b.x0,b.y1-b.y0,4)*1.5+3;cam.yaw=.6;cam.pitch=.65;
}
function resize(){
  const r=$('#stage').getBoundingClientRect();
  dpr=window.devicePixelRatio||1;W=r.width;H=r.height;
  cv.width=Math.max(1,W*dpr);cv.height=Math.max(1,H*dpr);
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);draw();
}

// ------- roofs: geometry shared by plan, 3D and cost
function roofGeom(r){
  const o=r.over||0,x0=r.x-o,y0=r.y-o,W=r.w+2*o,D=r.d+2*o;
  let ax=r.dir==='y'?'y':r.dir==='x'?'x':(W>=D?'x':'y');
  if(r.type==='hip')ax=W>=D?'x':'y';
  return{x0,y0,W,D,ax,o};
}

// ------- 2D plan drawing
function drawPlan(){
  ctx.globalAlpha=1;ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
  const [x0,y0]=s2w(0,0),[x1,y1]=s2w(W,H);
  const step=view.s>=30?.5:view.s>=14?1:5;
  ctx.lineWidth=1;
  for(let x=Math.floor(x0/step)*step;x<=x1;x+=step){
    const sx=Math.round((x-view.x)*view.s+W/2)+.5;
    ctx.strokeStyle=Math.abs(x-Math.round(x))<1e-6?'#222a35':'#181e27';
    ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx,H);ctx.stroke();
  }
  for(let y=Math.floor(y0/step)*step;y<=y1;y+=step){
    const sy=Math.round((y-view.y)*view.s+H/2)+.5;
    ctx.strokeStyle=Math.abs(y-Math.round(y))<1e-6?'#222a35':'#181e27';
    ctx.beginPath();ctx.moveTo(0,sy);ctx.lineTo(W,sy);ctx.stroke();
  }
  // rooms
  for(const r of S.rooms){
    const [sx,sy]=w2s(r.x,r.y);
    ctx.globalAlpha=.55*gh(1);ctx.fillStyle=FLOORS[r.floor]?FLOORS[r.floor].c:'#888';
    ctx.fillRect(sx,sy,r.w*view.s,r.d*view.s);planPattern(r,sx,sy);
    ctx.globalAlpha=gh(1);ctx.fillStyle='rgba(255,255,255,.75)';ctx.font='12px system-ui';ctx.textAlign='center';
    if(r.w*view.s>60){ctx.fillText(r.name,sx+r.w*view.s/2,sy+r.d*view.s/2-4);
      ctx.fillStyle='rgba(255,255,255,.45)';ctx.fillText((r.w*r.d).toFixed(1)+' m²',sx+r.w*view.s/2,sy+r.d*view.s/2+11);}
  }
  // walls
  ctx.lineCap='square';
  for(const w of S.walls){
    const [ax,ay]=w2s(w.x1,w.y1),[bx,by]=w2s(w.x2,w.y2);
    ctx.globalAlpha=gh(2);ctx.strokeStyle='#d5dbe3';ctx.lineWidth=Math.max(3,w.t*view.s);
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();
    if(w.cl||w.cr){
      const th=Math.max(6,w.t*view.s),L=Math.hypot(bx-ax,by-ay)||1,nx=-(by-ay)/L,ny=(bx-ax)/L;
      ctx.lineWidth=th;ctx.strokeStyle='#d5dbe3';ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();
      [['cl',1],['cr',-1]].forEach(([k,sg])=>{if(!w[k])return;ctx.strokeStyle=w[k];ctx.lineWidth=th*.38;ctx.beginPath();
        ctx.moveTo(ax+nx*sg*th*.31,ay+ny*sg*th*.31);ctx.lineTo(bx+nx*sg*th*.31,by+ny*sg*th*.31);ctx.stroke();});
    }
  }
  // openings
  for(const o of S.opens){
    const w=wallOf(o.wall);if(!w)continue;
    const L=Math.hypot(w.x2-w.x1,w.y2-w.y1)||1,ux=(w.x2-w.x1)/L,uy=(w.y2-w.y1)/L;
    const cx=w.x1+(w.x2-w.x1)*o.t,cy=w.y1+(w.y2-w.y1)*o.t;
    const [ax,ay]=w2s(cx-ux*o.w/2,cy-uy*o.w/2),[bx,by]=w2s(cx+ux*o.w/2,cy+uy*o.w/2);
    ctx.globalAlpha=gh(4);ctx.lineCap='butt';
    ctx.strokeStyle=BG;ctx.lineWidth=Math.max(3,w.t*view.s)+3;
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();
    if(o.kind==='door'){
      const rr=o.w*view.s,a0=Math.atan2(by-ay,bx-ax);
      ctx.strokeStyle='#4da3ff';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ax+Math.cos(a0+Math.PI/2)*rr,ay+Math.sin(a0+Math.PI/2)*rr);ctx.stroke();
      ctx.globalAlpha=gh(4)*.6;ctx.beginPath();ctx.arc(ax,ay,rr,a0,a0+Math.PI/2,false);ctx.stroke();
    }else{
      ctx.strokeStyle='#8ec9ff';ctx.lineWidth=Math.max(2,w.t*view.s*.35);
      ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();
    }
  }
  // furniture
  for(const f of S.furn){
    const F=FURN[f.kind],[sx,sy]=w2s(f.x,f.y),w=f.w*view.s,d=f.d*view.s;
    ctx.save();ctx.translate(sx,sy);ctx.rotate(f.rot*Math.PI/180);

    ctx.restore();
    if(w>48&&f.kind!=='rug'){ctx.globalAlpha=gh(5)*.8;ctx.fillStyle='#000';ctx.font='10px system-ui';ctx.textAlign='center';ctx.fillText(F.n,sx,sy+3);}

      }else if(sel.type==='rooms'){

        ctx.strokeRect(-o.w*view.s/2-2,-o.d*view.s/2-2,o.w*view.s+4,o.d*view.s+4);ctx.restore();
      }else if(sel.type==='opens'){

      }
    }
  }
  ctx.globalAlpha=1;
  if(sel&&sel.type==='roofs'){const o=get('roofs',sel.id);if(o){const g=roofGeom(o),[rx,ry]=w2s(g.x0,g.y0);ctx.strokeStyle='#4da3ff';ctx.lineWidth=2.5;ctx.setLineDash([6,4]);ctx.strokeRect(rx,ry,g.W*view.s,g.D*view.s);ctx.setLineDash([]);}}
  // drag previews
  if(drag&&drag.mode==='wall'){

    ctx.strokeStyle='#4da3ff';ctx.lineWidth=3;ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();ctx.setLineDash([]);

    ctx.fillText(Math.hypot(drag.b[0]-drag.a[0],drag.b[1]-drag.a[1]).toFixed(2)+' m',bx+8,by-8);

    ctx.fillRect(sx,sy,w*view.s,d*view.s);ctx.strokeRect(sx,sy,w*view.s,d*view.s);ctx.setLineDash([]);
    ctx.fillStyle='#4da3ff';ctx.font='12px system-ui';ctx.textAlign='left';ctx.fillText(w.toFixed(2)+' × '+d.toFixed(2)+' m',sx+6,sy+16);

// ------- 3D renderer (own perspective projection, painter's algorithm)
function hex(c){const n=parseInt(c.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}

function shade(col,n){

function box(out,cx,cy,ang,hl,hd,z0,z1,col,skip,sc){

function quadGrid(out,A,B,C,D,n,m,nrm,col,soft){

function roofFaces(out,r){

    for(let i=0;i<nx;i++)for(let j=0;j<ny;j++){

function floorLines3d(seg){

function buildFaces(){

    const dx=w.x2-w.x1,dy=w.y2-w.y1,L=Math.hypot(dx,dy);if(L<.01)continue;
    const ux=dx/L,uy=dy/L,ang=Math.atan2(dy,dx),col='#e6e1d8',sc=[w.cr||col,col,w.cl||col,col];
    const ops=phase>=4?S.opens.filter(o=>o.wall===w.id).map(o=>({a:Math.max(0,o.t*L-o.w/2),b:Math.min(L,o.t*L+o.w/2),o})).sort((p,q)=>p.a-q.a):[];

        const m1=op.a,m2=op.b;
        out.push({p:[[w.x1+ux*m1,w.y1+uy*m1,.9],[w.x1+ux*m2,w.y1+uy*m2,.9],[w.x1+ux*m2,w.y1+uy*m2,Math.min(2.1,w.h)],[w.x1+ux*m1,w.y1+uy*m1,Math.min(2.1,w.h)]],n:[-uy,ux,0],col:'#8ec9ff',glass:true});

      box(out,f.x+lx*c-ly*s,f.y+lx*s+ly*c,ang,p[2]*f.w/2,p[3]*f.d/2,p[4],p[5],p[6]);
    }
  }
  if(showRoof&&phase>=3)for(const r of S.roofs)roofFaces(out,r);
  if(inside!=null&&showRoof&&phase>=3)for(const r of S.rooms){
    const cx=r.x+r.w/2,cy=r.y+r.d/2,q=S.roofs.find(q=>cx>=q.x-q.over&&cx<=q.x+q.w+q.over&&cy>=q.y-q.over&&cy<=q.y+q.d+q.over);
    if(!q)continue;const z=q.base||S.wallH,s0=out.length;
    quadGrid(out,[r.x,r.y,z],[r.x+r.w,r.y,z],[r.x+r.w,r.y+r.d,z],[r.x,r.y+r.d,z],Math.max(1,Math.ceil(r.w/3)),Math.max(1,Math.ceil(r.d/3)),[0,0,-1],'#d4d0c8',true);

function makeCam(){
  const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch),cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw);
  const px=cam.tx+cam.dist*cp*sy,py=cam.ty+cam.dist*sp,pz=cam.tz+cam.dist*cp*cy;
  let fx=cam.tx-px,fy=cam.ty-py,fz=cam.tz-pz;const fl=Math.hypot(fx,fy,fz);fx/=fl;fy/=fl;fz/=fl;
  let rx=-fz,rz=fx;const rl=Math.hypot(rx,rz)||1;rx/=rl;rz/=rl;
  const ux=-rz*fy,uy=rz*fx-rx*fz,uz=rx*fy;
  const foc=inside!=null?W*.8:Math.max(H,W*.6)*.95;
  return{px,py,pz,fx,fy,fz,rx,rz,ux,uy,uz,foc};
}
function draw3d(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2b3a4f');g.addColorStop(1,'#10141a');
  ctx.globalAlpha=1;ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const C=makeCam(),NEAR=.06;
  const cam3=(x,y,z)=>{const vx=x-C.px,vy=z-C.py,vz=y-C.pz;return[vx*C.rx+vz*C.rz,vx*C.ux+vy*C.uy+vz*C.uz,vx*C.fx+vy*C.fy+vz*C.fz];};
  const scr=c=>[W/2+c[0]/c[2]*C.foc,H/2-c[1]/c[2]*C.foc,c[2]];
  const clipPoly=pts=>{
    const cs=pts.map(p=>cam3(p[0],p[1],p[2])),o=[];
    for(let i=0;i<cs.length;i++){
      const a=cs[i],b=cs[(i+1)%cs.length],ia=a[2]>=NEAR,ib=b[2]>=NEAR;
      if(ia)o.push(a);
      if(ia!==ib){const t=(NEAR-a[2])/(b[2]-a[2]);o.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,NEAR]);}
    }
    return o.length<3?null:o.map(scr);
  };
  const seg=(a,b)=>{
    let p=cam3(a[0],a[1],a[2]),q=cam3(b[0],b[1],b[2]);
    if(p[2]<NEAR&&q[2]<NEAR)return null;
    if(p[2]<NEAR){const t=(NEAR-p[2])/(q[2]-p[2]);p=[p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t,NEAR];}
    else if(q[2]<NEAR){const t=(NEAR-q[2])/(p[2]-q[2]);q=[q[0]+(p[0]-q[0])*t,q[1]+(p[1]-q[1])*t,NEAR];}
    const A=scr(p),B=scr(q);return[A[0],A[1],B[0],B[1]];
  };
  const b=bounds(),pad=6,gx0=Math.floor(b.x0-pad),gx1=Math.ceil(b.x1+pad),gy0=Math.floor(b.y0-pad),gy1=Math.ceil(b.y1+pad);
  const gp=clipPoly([[gx0,gy0,0],[gx1,gy0,0],[gx1,gy1,0],[gx0,gy1,0]]);
  if(gp){ctx.fillStyle='#1b222b';ctx.beginPath();gp.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill();}
  ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=1;ctx.beginPath();
  for(let x=gx0;x<=gx1;x++){const q=seg([x,gy0,0],[x,gy1,0]);if(q){ctx.moveTo(q[0],q[1]);ctx.lineTo(q[2],q[3]);}}
  for(let y=gy0;y<=gy1;y++){const q=seg([gx0,y,0],[gx1,y,0]);if(q){ctx.moveTo(q[0],q[1]);ctx.lineTo(q[2],q[3]);}}
  ctx.stroke();
  const {out,floors}=buildFaces();
  const polys=[];
  const cpx=C.px,cpy=C.pz,cpz=C.py;
  const emit=f=>{
    const cx=(f.p[0][0]+f.p[2][0])/2,cy=(f.p[0][1]+f.p[2][1])/2,cz=(f.p[0][2]+f.p[2][2])/2;
    if(!f.glass){const d=f.n[0]*(cpx-cx)+f.n[1]*(cpy-cy)+f.n[2]*(cpz-cz);if(d<=0)return;}
    const P=clipPoly(f.p);if(!P)return;
    const dx=cpx-cx,dy=cpy-cy,dz=cpz-cz;
    polys.push({P,key:dx*dx+dy*dy+dz*dz,col:f.glass?'rgba(142,201,255,.38)':f.flat?f.col:shade(f.col,f.n),glass:!!f.glass,soft:!!f.soft});
  };
  for(const f of floors){
    const P=clipPoly(f.p);if(!P)continue;
    ctx.fillStyle=shade(f.col,f.n);ctx.beginPath();P.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill();
  }
  if(phase>=1)floorLines3d(seg);
  out.forEach(emit);
  polys.sort((a,b)=>b.key-a.key);
  ctx.lineWidth=1;ctx.lineJoin='round';
  for(const p of polys){
    ctx.fillStyle=p.col;ctx.strokeStyle=p.glass?'rgba(255,255,255,.5)':p.soft?'rgba(0,0,0,.13)':'rgba(0,0,0,.28)';
    ctx.beginPath();p.P.forEach((v,i)=>i?ctx.lineTo(v[0],v[1]):ctx.moveTo(v[0],v[1]));ctx.closePath();ctx.fill();ctx.stroke();
  }
}
function draw(){
  if(!W)return;
  if(inside!=null&&!get('rooms',inside)){inside=null;if(savedCam){Object.assign(cam,savedCam);savedCam=null;}renderRoomSel();}
  if(tab==='plan'){syncWh();drawPlan();}else if(tab==='3d')draw3d();
}

// ------- hit testing & geometry
function distSeg(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;
  let t=l2?((px-x1)*dx+(py-y1)*dy)/l2:0;t=clamp(t,0,1);
  return{d:Math.hypot(px-(x1+t*dx),py-(y1+t*dy)),t};
}
function hit(x,y){
  const tol=9/view.s;
  for(const o of S.opens){
    const w=wallOf(o.wall);if(!w)continue;
    const cx=w.x1+(w.x2-w.x1)*o.t,cy=w.y1+(w.y2-w.y1)*o.t;
    if(Math.hypot(x-cx,y-cy)<Math.max(o.w/2,tol)&&distSeg(x,y,w.x1,w.y1,w.x2,w.y2).d<Math.max(w.t,tol))return{type:'opens',id:o.id};
  }
  for(let i=S.furn.length-1;i>=0;i--){
    const f=S.furn[i],a=-f.rot*Math.PI/180,dx=x-f.x,dy=y-f.y;
    const lx=dx*Math.cos(a)-dy*Math.sin(a),ly=dx*Math.sin(a)+dy*Math.cos(a);
    if(Math.abs(lx)<=f.w/2+tol/2&&Math.abs(ly)<=f.d/2+tol/2)return{type:'furn',id:f.id};
  }
  for(let i=S.walls.length-1;i>=0;i--){
    const w=S.walls[i];if(distSeg(x,y,w.x1,w.y1,w.x2,w.y2).d<=Math.max(w.t/2,tol))return{type:'walls',id:w.id};
  }
  if(showRoof&&phase>=3)for(let i=S.roofs.length-1;i>=0;i--){
    const g=roofGeom(S.roofs[i]);
    if(x>=g.x0-tol&&x<=g.x0+g.W+tol&&y>=g.y0-tol&&y<=g.y0+g.D+tol&&(Math.abs(x-g.x0)<tol||Math.abs(x-g.x0-g.W)<tol||Math.abs(y-g.y0)<tol||Math.abs(y-g.y0-g.D)<tol))return{type:'roofs',id:S.roofs[i].id};
  }
  for(let i=S.rooms.length-1;i>=0;i--){
    const r=S.rooms[i];if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.d)return{type:'rooms',id:r.id};
  }
  if(showRoof&&phase>=3)for(let i=S.roofs.length-1;i>=0;i--){
    const g=roofGeom(S.roofs[i]);
    if(x>=g.x0&&x<=g.x0+g.W&&y>=g.y0&&y<=g.y0+g.D)return{type:'roofs',id:S.roofs[i].id};
  }
  return null;
}
function nearestWall(x,y,maxd){
  let best=null;
  for(const w of S.walls){const r=distSeg(x,y,w.x1,w.y1,w.x2,w.y2);if(r.d<=maxd&&(!best||r.d<best.d))best={w,d:r.d,t:r.t};}
  return best;
}
function snapPt(x,y){
  let px=sn(x),py=sn(y),bd=.3;
  for(const w of S.walls)for(const e of [[w.x1,w.y1],[w.x2,w.y2]]){const d=Math.hypot(x-e[0],y-e[1]);if(d<bd){bd=d;px=e[0];py=e[1];}}
  return[px,py];
}
function removeObj(s){
  if(!s)return;
  if(s.type==='walls')S.opens=S.opens.filter(o=>o.wall!==s.id);
  S[s.type]=S[s.type].filter(o=>o.id!==s.id);
}

// ------- inside view
const EYE=1.6;
function applyFP(){
  const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch),sy=Math.sin(cam.yaw),cy=Math.cos(cam.yaw);
  cam.dist=1;cam.tx=fp.x-cp*sy;cam.ty=EYE-sp;cam.tz=fp.y-cp*cy;
}
function walk(d){fp.x+=-Math.sin(cam.yaw)*d;fp.y+=-Math.cos(cam.yaw)*d;applyFP();draw();}
function enterRoom(id){

// ------- wall paint
const PAINTS=['#f5f1e8','#ffffff','#e9d8b4','#f2c6b4','#e8a0a0','#c9d8c5','#a8c5d6','#6f9bc4','#d8c3e0','#f4e4a6','#d9d9d9','#5c6b73','#a47551','#2f3b44'];
function buildSw(){
  $('#sw').innerHTML=PAINTS.map(c=>`<button class="swb${paintColor===c?' on':''}" data-c="${c}" style="background:${c}"></button>`).join('')+`<button class="swb${paintColor===''?' on':''}" data-c="" title="Remove paint" style="background:repeating-linear-gradient(45deg,#333 0 4px,#666 4px 8px)">✕</button>`;
}
function wallSide(w,x,y){
  const L=Math.hypot(w.x2-w.x1,w.y2-w.y1)||1,ux=(w.x2-w.x1)/L,uy=(w.y2-w.y1)/L;
  return((x-w.x1)*(-uy)+(y-w.y1)*ux)>=0?'cl':'cr';
}
function paintWall(w,side,col){if(col)w[side]=col;else delete w[side];}
function paintRoom(r,col){
  let n=0;const cx=r.x+r.w/2,cy=r.y+r.d/2,tw=.6;
  for(const w of S.walls){
    const dx=w.x2-w.x1,dy=w.y2-w.y1,L=Math.hypot(dx,dy);if(L<.2)continue;
    let ok=false;
    if(Math.abs(dy)<.05){
      const yy=(w.y1+w.y2)/2,a=Math.min(w.x1,w.x2),b=Math.max(w.x1,w.x2),ov=Math.min(b,r.x+r.w)-Math.max(a,r.x);
      ok=(Math.abs(yy-r.y)<tw||Math.abs(yy-(r.y+r.d))<tw)&&ov>=.4*Math.min(L,r.w);
    }else if(Math.abs(dx)<.05){
      const xx=(w.x1+w.x2)/2,a=Math.min(w.y1,w.y2),b=Math.max(w.y1,w.y2),ov=Math.min(b,r.y+r.d)-Math.max(a,r.y);
      ok=(Math.abs(xx-r.x)<tw||Math.abs(xx-(r.x+r.w))<tw)&&ov>=.4*Math.min(L,r.d);
    }
    if(ok){paintWall(w,wallSide(w,cx,cy),col);n++;}
  }
  return n;
}
function paintAt(x,y){
  const tol=14/view.s;let best=null;
  for(const w of S.walls){const r=distSeg(x,y,w.x1,w.y1,w.x2,w.y2);if(r.d<=Math.max(w.t/2+tol*.5,tol)&&(!best||r.d<best.d))best={w,d:r.d};}
  if(best){
    undoPush();
    if($('#pboth').checked){paintWall(best.w,'cl',paintColor);paintWall(best.w,'cr',paintColor);}
    else paintWall(best.w,wallSide(best.w,x,y),paintColor);
    save();draw();return;
  }
  for(let i=S.rooms.length-1;i>=0;i--){
    const r=S.rooms[i];
    if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.d){
      undoPush();const n=paintRoom(r,paintColor);
      if(!n){hist.pop();toast('No walls found around this room');return;}
      save();draw();toast('Painted '+n+' wall side'+(n>1?'s':'')+' in '+r.name);return;
    }
  }
}
function syncWh(){const e=$('#wh');if(e&&document.activeElement!==e)e.value=r2(S.wallH);}

const ptrs=new Map();let drag=null,pinch=null;
function evPos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}
cv.addEventListener('contextmenu',e=>e.preventDefault());

  }else if(tool==='furn'){

  }else if(tool==='erase'){

cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  const p=evPos(e);ptrs.set(e.pointerId,p);
  if(pinch&&ptrs.size===2){
    const [a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1])||1;
    if(tab==='plan')view.s=clamp(pinch.s*d/pinch.d,3,200);else if(inside!=null){walk((d-pinch.d)*.03);pinch.d=d;}else cam.dist=clamp(pinch.dist*pinch.d/d,2,100);
    draw();return;
  }
  if(!drag)return;
  if(drag.mode==='look'){
    cam.yaw+=(p[0]-drag.last[0])*.006;cam.pitch=clamp(cam.pitch-(p[1]-drag.last[1])*.006,-1.3,1.3);drag.last=p;applyFP();
  }else if(drag.mode==='orbit'){
    cam.yaw-=(p[0]-drag.last[0])*.008;cam.pitch=clamp(cam.pitch+(p[1]-drag.last[1])*.008,.05,1.5);drag.last=p;
  }else if(drag.mode==='pan3'){
    const C=makeCam(),k=cam.dist*.0016,gl=Math.hypot(C.fx,C.fz)||1;
    const dx=p[0]-drag.last[0],dy=p[1]-drag.last[1];
    cam.tx+=-C.rx*dx*k+C.fx/gl*dy*k;cam.tz+=-C.rz*dx*k+C.fz/gl*dy*k;drag.last=p;
  }else if(drag.mode==='pan'||drag.mode==='paintpan'){
    if(drag.mode==='paintpan'&&Math.hypot(p[0]-drag.start[0],p[1]-drag.start[1])>8)drag.moved=true;
    view.x-=(p[0]-drag.last[0])/view.s;view.y-=(p[1]-drag.last[1])/view.s;drag.last=p;
  }else{
    const [wx,wy]=s2w(p[0],p[1]);
    if(drag.mode==='wall')drag.b=snapPt(wx,wy);
    else if(drag.mode==='room'||drag.mode==='roof')drag.b=[sn(wx),sn(wy)];
    else if(drag.mode==='move'){
      const o=get(drag.h.type,drag.h.id),or=drag.orig,dx=wx-drag.start[0],dy=wy-drag.start[1];
      if(!o)return;
      if(drag.h.type==='furn'){o.x=sn(or.x+dx,.05);o.y=sn(or.y+dy,.05);}
      else if(drag.h.type==='rooms'||drag.h.type==='roofs'){o.x=sn(or.x+dx);o.y=sn(or.y+dy);}
      else if(drag.h.type==='walls'){const mx=sn(dx),my=sn(dy);o.x1=or.x1+mx;o.y1=or.y1+my;o.x2=or.x2+mx;o.y2=or.y2+my;}
    }else if(drag.mode==='moveopen'){
      const o=get('opens',drag.h.id),w=o&&wallOf(o.wall);

    }
  }
  draw();
});
function endPtr(e){

  }else if(drag.mode==='room'){

  }else if(drag.mode==='roof'){

}

  if(tab==='plan'){
    const [wx,wy]=s2w(p[0],p[1]);view.s=clamp(view.s*Math.exp(-e.deltaY*.0015),3,200);
    const [nx,ny]=s2w(p[0],p[1]);view.x+=wx-nx;view.y+=wy-ny;
  }else if(tab==='3d'){if(inside!=null)walk(-e.deltaY*.004);else cam.dist=clamp(cam.dist*Math.exp(e.deltaY*.001),2,100);}
  draw();
},{passive:false});

// ------- inspector
const insp=$('#insp');
function roofInsp(o,num){
  const opt=(cur,m)=>Object.keys(m).map(v=>`<option value="${v}"${cur===v?' selected':''}>${typeof m[v]==='string'?m[v]:m[v].n}</option>`).join('');
  const ar=roofArea(o);
  return `<b>Roof</b><label>Type<select data-k="type">${opt(o.type,RTYPES)}</select></label><label>Material<select data-k="mat">${opt(o.mat,ROOFS)}</select></label>`
   +(o.type==='flat'?'':num('pitch','Pitch°',1))+num('over','Overhang')+num('base','Base height')
   +(o.type==='gable'||o.type==='shed'?`<label>Ridge<select data-k="dir">${opt(o.dir,{auto:'Auto',x:'Along X',y:'Along Y'})}</select></label>`:'')
   +(o.type==='shed'?'<button data-a="flip">Flip slope</button>':'')
   +num('x','X')+num('y','Y')+num('w','W')+num('d','D')
   +`<span style="color:var(--mut)">${ar.toFixed(0)} m² · ${money(ar*(S.prices.roof[o.mat]||0))}</span>`;
}
function renderInsp(){
  if(!sel||tab!=='plan'){insp.style.display='none';return;}
  const o=get(sel.type,sel.id);if(!o){sel=null;insp.style.display='none';return;}
  const num=(k,l,st)=>`<label>${l}<input type="number" data-k="${k}" step="${st||.05}" value="${r2(o[k])}"></label>`;
  let h='';
  if(sel.type==='furn')h=`<b>${FURN[o.kind].n}</b>${num('w','W')}${num('d','D')}<button data-a="rot">Rotate 90°</button><button data-a="dup">Copy</button>`;
  else if(sel.type==='rooms')h=`<label>Name<input type="text" data-k="name" value="${o.name.replace(/"/g,'&quot;')}" style="width:110px"></label>${num('w','W')}${num('d','D')}<label>Floor<select data-k="floor">${Object.keys(FLOORS).map(k=>`<option value="${k}"${o.floor===k?' selected':''}>${FLOORS[k].n}</option>`).join('')}</select></label><span style="color:var(--mut)">${money(S.prices.floor[o.floor])}/m²</span><button data-a="floorall">Floor to all rooms</button><button data-a="roofit">Roof this room</button><button data-a="inside">View inside</button>`;
  else if(sel.type==='walls')h=`<b>Wall ${Math.hypot(o.x2-o.x1,o.y2-o.y1).toFixed(2)} m</b>${num('t','Thick')}${num('h','Height')}`;
  else if(sel.type==='roofs')h=roofInsp(o,num);
  else h=`<label>Type<select data-k="kind"><option value="door"${o.kind==='door'?' selected':''}>Door</option><option value="window"${o.kind==='window'?' selected':''}>Window</option></select></label>${num('w','Width')}`;
  h+=`<button data-a="del">Delete</button>`;
  insp.innerHTML=h;insp.style.display='flex';
}
insp.addEventListener('change',e=>{
  const k=e.target.dataset.k;if(!k||!sel)return;
  const o=get(sel.type,sel.id);if(!o)return;undoPush();
  if(e.target.type==='number'){const v=parseFloat(e.target.value);const ok=(k==='x'||k==='y')?!isNaN(v):(k==='over'?v>=0:v>0);if(ok)o[k]=v;}else o[k]=e.target.value;
  save();renderInsp();draw();
});
insp.addEventListener('click',e=>{
  const a=e.target.dataset.a;if(!a||!sel)return;
  const o=get(sel.type,sel.id);if(!o)return;
  if(a==='inside'){setTab('3d');enterRoom(o.id);return;}
  undoPush();
  if(a==='del'){removeObj(sel);sel=null;}
  else if(a==='rot')o.rot=((o.rot||0)+90)%360;
  else if(a==='dup'){const c=add('furn',{...o,x:o.x+.4,y:o.y+.4});sel={type:'furn',id:c.id};}
  else if(a==='roofit'){const c=newRoof(o.x,o.y,o.w,o.d);sel={type:'roofs',id:c.id};}
  else if(a==='floorall'){S.rooms.forEach(r=>{r.floor=o.floor;});}
  else if(a==='flip')o.flip=!o.flip;
  save();renderInsp();draw();
});

// ------- cost & schedule (4D / 5D)
function calc(){
  const r=S.rates,P=S.prices;
  const area=S.rooms.reduce((a,o)=>a+o.w*o.d,0);
  const fm={};S.rooms.forEach(o=>{fm[o.floor]=(fm[o.floor]||0)+o.w*o.d;});
  const fcost=Object.keys(fm).reduce((a,k)=>a+fm[k]*(P.floor[k]||0),0);
  const wl=S.walls.reduce((a,w)=>a+Math.hypot(w.x2-w.x1,w.y2-w.y1),0);
  const wa=S.walls.reduce((a,w)=>a+Math.hypot(w.x2-w.x1,w.y2-w.y1)*w.h,0);
  const rm={};let ra=0;S.roofs.forEach(o=>{const x=roofArea(o);rm[o.mat]=(rm[o.mat]||0)+x;ra+=x;});
  const rcost=Object.keys(rm).reduce((a,k)=>a+rm[k]*(P.roof[k]||0),0);
  const nd=S.opens.filter(o=>o.kind==='door').length,nw=S.opens.length-nd;
  const fc=S.furn.reduce((a,f)=>a+FURN[f.kind].price,0);
  const rows=[
    {q:area.toFixed(1)+' m² of floor',cost:fcost,days:S.rooms.length?Math.ceil(2+area/25):0},
    {q:wl.toFixed(1)+' m of walls ('+wa.toFixed(0)+' m²)',cost:wa*r.wall,days:S.walls.length?Math.ceil(2+wl/5):0},
    {q:S.roofs.length?ra.toFixed(1)+' m² of roof ('+S.roofs.length+')':'no roof yet',cost:rcost,days:S.roofs.length?Math.ceil(2+ra/35):0},
    {q:nd+' doors, '+nw+' windows',cost:nd*r.door+nw*r.window,days:Math.ceil((nd+nw)*.5)},
    {q:S.furn.length+' items',cost:fc,days:Math.ceil(S.furn.length*.3)}
  ];
  let t=0,c=0;rows.forEach((x,i)=>{x.n=PH[i].n;x.col=PH[i].c;x.start=t;t+=x.days;c+=x.cost;x.cum=c;x.end=t;});
  return{rows,total:c,days:t,fm,rm};
}
function renderCost(){
  const C=calc(),r=S.rates,P=S.prices,el=$('#cost');
  const fcount={};S.furn.forEach(f=>fcount[f.kind]=(fcount[f.kind]||0)+1);
  const pin=(attr,set,key)=>`<label>${set[key].n}<input type="number" data-${attr}="${key}" value="${(attr==='pf'?P.floor:P.roof)[key]}"></label>`;
  const sw=c=>`<span class="dot" style="background:${c}"></span>`;
  el.innerHTML=`
  <h2>Total estimate</h2>
  <div class="big">${money(C.total)} <span style="font-size:14px;color:var(--mut);font-weight:400">· ${C.days} working days</span></div>
  <h2>Rates</h2>
  <div class="rates">
    <label>Currency <input type="text" data-cur="1" value="${S.cur}" style="width:50px"></label>
    <label>Wall / m² <input type="number" data-rate="wall" value="${r.wall}"></label>
    <label>Door each <input type="number" data-rate="door" value="${r.door}"></label>
    <label>Window each <input type="number" data-rate="window" value="${r.window}"></label>
  </div>
  <h2>Floor materials (price per m²)</h2>
  <div class="rates">${Object.keys(FLOORS).map(k=>pin('pf',FLOORS,k)).join('')}</div>
  <h2>Roof materials (price per m² of roof surface)</h2>
  <div class="rates">${Object.keys(ROOFS).map(k=>pin('pr',ROOFS,k)).join('')}</div>
  <h2>Cost by phase (5D)</h2>
  <table><tr><th>Phase</th><th>Quantity</th><th class="r">Cost</th><th class="r">Cumulative</th></tr>
  ${C.rows.map(x=>`<tr><td>${sw(x.col)}${x.n}</td><td>${x.q}</td><td class="r">${money(x.cost)}</td><td class="r">${money(x.cum)}</td></tr>`).join('')}
  </table>
  <h2>Surfaces</h2>
  <table><tr><th>Material</th><th class="r">Area</th><th class="r">Cost</th></tr>
  ${Object.keys(C.fm).map(k=>`<tr><td>${sw(FLOORS[k].c)}Floor · ${FLOORS[k].n}</td><td class="r">${C.fm[k].toFixed(1)} m²</td><td class="r">${money(C.fm[k]*P.floor[k])}</td></tr>`).join('')}
  ${Object.keys(C.rm).map(k=>`<tr><td>${sw(ROOFS[k].c)}Roof · ${ROOFS[k].n}</td><td class="r">${C.rm[k].toFixed(1)} m²</td><td class="r">${money(C.rm[k]*P.roof[k])}</td></tr>`).join('')}
  </table>
  ${S.roofs.length?'':'<div class="note">No roof yet. In Plan, use the Roof tool or Auto roof.</div>'}
  <h2>Schedule (4D)</h2>
  <div class="gantt">${C.rows.map(x=>`<div class="grow"><span class="l">${x.n}</span><div class="gtrack">${x.days?`<div class="gbar" style="left:${x.start/Math.max(1,C.days)*100}%;width:${x.days/Math.max(1,C.days)*100}%;background:${x.col}">${x.days}d</div>`:''}</div></div>`).join('')}</div>
  <h2>Furniture</h2>
  ${S.furn.length?`<table><tr><th>Item</th><th class="r">Qty</th><th class="r">Unit</th><th class="r">Total</th></tr>${Object.keys(fcount).map(k=>`<tr><td>${FURN[k].n}</td><td class="r">${fcount[k]}</td><td class="r">${money(FURN[k].price)}</td><td class="r">${money(FURN[k].price*fcount[k])}</td></tr>`).join('')}</table>`:'<div class="note">No furniture placed yet.</div>'}
  <p class="note">Wall cost uses gross wall area (length × height), without subtracting openings. Roof area is the plan area including overhang divided by cos(pitch), or the plain slab area for flat roofs. Durations are rough rule-of-thumb working days, run one phase after another. Use the build-phase slider below to step through the construction sequence in Plan and 3D.</p>`;
}
$('#cost').addEventListener('change',e=>{
  const d=e.target.dataset,v=parseFloat(e.target.value);
  if(d.rate){if(v>=0)S.rates[d.rate]=v;}
  else if(d.pf){if(v>=0)S.prices.floor[d.pf]=v;}
  else if(d.pr){if(v>=0)S.prices.roof[d.pr]=v;}
  else if(d.cur)S.cur=e.target.value||'$';
  save();renderCost();updPhase();
});

// ------- UI wiring
const HINTS={
  select:'Drag to move · drag empty space to pan · wheel / pinch to zoom',
  wall:'Drag to draw a wall (snaps to 0.25 m and to wall ends)',
  room:'Drag a rectangle to add a room with a floor',
  door:'Tap a wall to place a door',window:'Tap a wall to place a window',
  furn:'Pick an item, then tap the plan to place it',roof:'Drag a rectangle to add a roof, then choose its type and material',paint:'Pick a colour, then tap a wall side, or tap inside a room to paint all its walls',erase:'Tap an object to delete it'
};
function setHint(){
  let t='';
  if(tab==='plan')t=(tool==='select'&&locked)?'Locked: tap to select, drag to move the view · tap 🔒 to unlock and move things':HINTS[tool];
  else if(tab==='3d')t=inside!=null?'Drag to look around · scroll / pinch or ▲ ▼ to walk · ⟲ ⟳ to turn':'Pick a room above to look inside · drag to orbit · pinch to zoom';
  $('#hint').textContent=t;
}
function setTab(t){
  tab=t;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  updBars();
  $('#cost').style.display=t==='cost'?'block':'none';
  cv.style.visibility=t==='cost'?'hidden':'visible';
  if(t==='cost')renderCost();
  if(t==='3d')renderRoomSel();
  setHint();renderInsp();resize();
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
document.querySelectorAll('#tools [data-tool]').forEach(b=>b.onclick=()=>{
  tool=b.dataset.tool;
  document.querySelectorAll('#tools [data-tool]').forEach(x=>x.classList.toggle('on',x===b));
  sel=null;renderInsp();updBars();setHint();resize();
});
$('#fk').innerHTML=Object.keys(FURN).map(k=>`<option value="${k}">${FURN[k].n}</option>`).join('');
$('#fk').onchange=()=>{tool='furn';document.querySelectorAll('#tools [data-tool]').forEach(x=>x.classList.toggle('on',x.dataset.tool==='furn'));setHint();};
function updPhase(){
  const C=calc(),row=C.rows[phase-1];
  $('#phl').textContent=phase+'/5 '+PH[phase-1].n+' · day '+row.end+' of '+C.days+' · '+money(row.cum);
}
$('#ph').oninput=e=>{phase=+e.target.value;updPhase();draw();};
$('#roofT').onchange=e=>{showRoof=e.target.checked;draw();};
$('#bAuto').onclick=autoRoof;
async function download(blob,name){
  const C=window.Capacitor,P=C&&C.Plugins;
  if(C&&C.isNativePlatform&&C.isNativePlatform()&&P&&P.Filesystem&&P.Share){
    try{
      const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob);});
      const f=await P.Filesystem.writeFile({path:name,data,directory:'CACHE'});
      await P.Share.share({title:name,url:f.uri,dialogTitle:'Save or share '+name});
      return;
    }catch(e){if(e&&/cancel/i.test(String(e.message||e)))return;alert('Export failed: '+(e&&e.message||e));return;}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
$('#bUndo').onclick=undo;
$('#bSave').onclick=()=>{doCheckpoint();download(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),'home-design.json');};
$('#bCk').onclick=()=>doCheckpoint();
$('#bRest').onclick=restoreCheckpoint;
$('#bLock').onclick=()=>{locked=!locked;try{localStorage.setItem('homestudio5d.lock',locked?'1':'0');}catch(e){}updLock();setHint();toast(locked?'Locked: things will not move':'Unlocked: drag to move things');};
$('#bWh').onclick=()=>{const v=parseFloat($('#wh').value);if(!(v>=2&&v<=10)){toast('Wall height must be 2 to 10 m');return;}undoPush();S.wallH=v;S.walls.forEach(w=>{w.h=v;});S.roofs.forEach(q=>{q.base=v;});save();draw();toast('All walls and roofs set to '+v+' m');};
$('#sw').onclick=e=>{const b=e.target.closest('.swb');if(!b)return;paintColor=b.dataset.c;if(paintColor)$('#pc').value=paintColor;buildSw();};
$('#pc').oninput=e=>{paintColor=e.target.value;buildSw();};
$('#pclr').onclick=()=>{if(!confirm('Remove paint from every wall?'))return;undoPush();S.walls.forEach(w=>{delete w.cl;delete w.cr;});save();draw();};
$('#rsel').onchange=e=>{const v=e.target.value;if(v)enterRoom(+v);else exitRoom();};
$('#rL').onclick=()=>{cam.yaw+=Math.PI/4;applyFP();draw();};
$('#rR').onclick=()=>{cam.yaw-=Math.PI/4;applyFP();draw();};
$('#rF').onclick=()=>walk(.8);
$('#rB').onclick=()=>walk(-.8);
$('#bLoad').onclick=()=>$('#file').click();
$('#file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||!Array.isArray(o.walls))throw 0;undoPush();S=o;norm();sel=null;save();fitPlan();resetCam();updPhase();renderInsp();draw();if(tab==='cost')renderCost();}catch(x){alert('That file is not a valid Home Studio design.');}};
  rd.readAsText(f);e.target.value='';
};
$('#bPng').onclick=()=>{if(tab==='cost')return;draw();cv.toBlob(b=>b&&download(b,'home-'+tab+'.png'));};
$('#bNew').onclick=()=>{if(confirm('Start a new empty design? (Use Undo to bring the old one back.)')){undoPush();S=blank();sel=null;save();fitPlan();resetCam();updPhase();renderInsp();draw();if(tab==='cost')renderCost();}};
window.addEventListener('keydown',e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return;}
  if(tab!=='plan')return;
  if((e.key==='Delete'||e.key==='Backspace')&&sel){undoPush();removeObj(sel);sel=null;save();renderInsp();draw();}
  else if(e.key.toLowerCase()==='r'&&sel&&sel.type==='furn'){undoPush();const o=get('furn',sel.id);o.rot=((o.rot||0)+90)%360;save();renderInsp();draw();}
  else if(e.key==='Escape'){sel=null;drag=null;renderInsp();draw();}
});
window.addEventListener('resize',resize);

if(!load())sample();
save();
setTab('plan');
fitPlan();resetCam();updPhase();
try{if(!localStorage.getItem(KEY+'.ck'))doCheckpoint(true);}catch(e){}
dirty=false;updCk();updLock();buildSw();renderRoomSel();draw();
})();
</script>
